<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/dxf@0.0.21/dist/dxf.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>QR CREATOR</h1>
        </header>

        <main>
            <div class="content">
                <!-- Input Panel -->
                <div class="input-panel">
                    <h2>QR VERİ GİR</h2>

                    <!-- TEDAŞ QR KOD -->
                    <div class="field-group collapsible-section">
                        <h3 class="section-header" onclick="toggleSection(this)">
                            <i class="fas fa-chevron-down"></i> TEDAŞ QR KOD
                        </h3>
                        <div class="section-content">
                        <div class="form-field">
                            <label>SERİ NO</label>
                            <input type="text" id="serino" placeholder="Seri numarası gir...">
                        </div>
                        <div class="form-field">
                            <label>İMAL TARİHİ</label>
                            <input type="text" id="imaltarihi" placeholder="İmal tarihini gir...">
                        </div>
                        <div class="form-field">
                            <label>TEDAŞ KIRILIM</label>
                            <input type="text" id="tedas" placeholder="TEDAŞ kırılımını gir...">
                        </div>
                        <div class="form-field">
                            <label>MARKA</label>
                            <input type="text" id="marka" placeholder="Markayı gir...">
                        </div>
                        <div class="form-field">
                            <label>FLAG</label>
                            <input type="text" id="flag" placeholder="Flag değerini gir...">
                        </div>
                        <div class="form-field">
                            <label>MODEL</label>
                            <input type="text" id="model" placeholder="Model gir...">
                        </div>
                        <div class="form-field">
                            <label>MODEL KODU</label>
                            <input type="text" id="modelkodu" placeholder="Model kodunu gir...">
                        </div>
                        </div>
                    </div>

                    <!-- İsteğe Bağlı -->
                    <div class="field-group collapsible-section">
                        <h3 class="section-header" onclick="toggleSection(this)">
                            <i class="fas fa-chevron-down"></i> İSTEĞE BAĞLI
                        </h3>
                        <div class="section-content">
                        <div class="form-field">
                            <label>ÖZEL METİN (İSTEĞE BAĞLI)</label>
                            <input type="text" id="customtext" placeholder="Herhangi bir metni gir...">
                        </div>
                        </div>
                    </div>
                </div>

                <!-- Preview Panel -->
                <div class="preview-panel">
                    <h2>QR KOD ÖNİZLEMESİ</h2>
                    <div class="preview-container">
                        <div id="qrPreview" class="qr-preview">
                            <div class="placeholder-animation">
                                <div class="animated-dots">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                                <div class="digital-face">
                                    <div class="face">
                                        <div class="eye left-eye">
                                            <div class="pupil left-pupil"></div>
                                        </div>
                                        <div class="eye right-eye">
                                            <div class="pupil right-pupil"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="preview-info">
                        <span id="statusText" class="status">Tüm alanları doldurun</span>
                        <span id="sizeText" class="size"></span>
                    </div>
                    <div id="qrTextDisplay" class="qr-text-display" style="display: none;">
                        <div class="qr-text-header">
                            <span>Oluşturulan Metin:</span>
                            <button id="copyQrTextBtn" class="btn-copy" title="Metni kopyala">
                                <i class="fas fa-copy"></i> Kopyala
                            </button>
                        </div>
                        <div id="qrTextContent" class="qr-text-content"></div>
                    </div>
                    <div class="button-group">
                        <button id="saveQrTextBtn" class="btn-save"><i class="fas fa-bookmark"></i> Kaydet</button>
                        <button id="downloadSavedBtn" class="btn-download"><i class="fas fa-download"></i> İndir</button>
                        <button id="exportDxfBtn" class="btn-secondary"><i class="fas fa-download"></i> DXF olarak indir</button>
                        <button id="exportPngBtn" class="btn-secondary"><i class="fas fa-download"></i> PNG olarak indir</button>
                        <button id="exportSvgBtn" class="btn-secondary"><i class="fas fa-download"></i> SVG olarak indir</button>
                    </div>
                </div>
            </div>

            <!-- Settings Bar -->
            <div class="settings-bar">
                <div class="setting-group">
                    <label>HATA DÜZELTME:</label>
                    <select id="errorLevel">
                        <option value="L">L (Düşük %7)</option>
                        <option value="M">M (Orta %15)</option>
                        <option value="Q">Q (Yüksek %25)</option>
                        <option value="H">H (Çok Yüksek %30)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>BOYUT (MM):</label>
                    <input type="number" id="sizeMm" min="5" max="200" value="20">
                </div>
            </div>

            <!-- Serial Number Generator -->
            <div class="series-generator-section">
                <h2><i class="fas fa-list-ol"></i> SERİ NUMARASI OLUŞTUR</h2>
                <div class="series-generator-content">
                    <div class="series-input-group">
                        <div class="series-field">
                            <label>ÜRÜN TİPİ</label>
                            <select id="productTypeGen">
                                <option value="normal">Normal Ürün (6 Haneli)</option>
                                <option value="electric_meter" selected>Elektronik Elektrik Sayacı (9 Haneli)</option>
                            </select>
                        </div>
                        <div class="series-field">
                            <label>BAŞLANGIÇ</label>
                            <input type="number" id="serino_start" placeholder="0" min="0">
                        </div>
                        <div class="series-field">
                            <label>BİTİŞ</label>
                            <input type="number" id="serino_end" placeholder="10" min="0">
                        </div>
                        <button id="generateSeriesBtn" class="btn-generate-large"><i class="fas fa-sync"></i> OLUŞTUR</button>
                    </div>
                    <div id="seriesOutput" class="series-output-large"></div>
                    <button id="downloadSeriesBtn" class="btn-download-series" style="display: none;">
                        <i class="fas fa-download"></i> TXT Olarak İndir
                    </button>
                </div>
            </div>
            <!-- Batch QR Text Generator -->
            <div class="series-generator-section batch-qr-section">
                <h2><i class="fas fa-layer-group"></i> TOPLU QR METNİ OLUŞTUR</h2>
                <div class="series-generator-content">
                    <div class="batch-fixed-grid">
                        <div class="series-field">
                            <label>TEDAŞ KIRILIM</label>
                            <input type="text" id="batchTedas" placeholder="258106">
                        </div>
                        <div class="series-field">
                            <label>MARKA</label>
                            <input type="text" id="batchMarka" placeholder="master meter">
                        </div>
                        <div class="series-field">
                            <label>FLAG</label>
                            <input type="text" id="batchFlag" placeholder="mas">
                        </div>
                        <div class="series-field">
                            <label>MODEL</label>
                            <input type="text" id="batchModel" placeholder="m1-pro">
                        </div>
                        <div class="series-field">
                            <label>MODEL KODU</label>
                            <input type="text" id="batchModelkodu" placeholder="PMD/CAN/0626">
                        </div>
                    </div>
                    <div class="batch-fill-row">
                        <button type="button" id="batchFillBtn" class="btn-batch-fill"><i class="fas fa-arrow-down"></i> Ana formdan doldur</button>
                    </div>
                    <div class="series-input-group">
                        <div class="series-field">
                            <label>BAŞLANGIÇ</label>
                            <input type="number" id="batchStart" placeholder="0" min="0">
                        </div>
                        <div class="series-field">
                            <label>BİTİŞ</label>
                            <input type="number" id="batchEnd" placeholder="10" min="0">
                        </div>
                        <div class="series-field">
                            <label id="batchDateLabel">İMAL TARİHİ</label>
                            <input type="text" id="batchDate" placeholder="30.05.2026">
                        </div>
                        <button id="batchGenerateBtn" class="btn-generate-large"><i class="fas fa-sync"></i> OLUŞTUR</button>
                    </div>
                    <div class="batch-date-mode">
                        <div class="series-field">
                            <label>TARİH MODU</label>
                            <select id="batchDateMode">
                                <option value="fixed">Sabit tarih (hepsi aynı)</option>
                                <option value="auto">Her seri için otomatik artsın</option>
                                <option value="list">Elle liste (her satıra bir tarih)</option>
                            </select>
                        </div>
                        <div id="batchStepWrap" class="series-field" style="display: none;">
                            <label>ARTIŞ (GÜN)</label>
                            <input type="number" id="batchStep" value="1" min="1">
                        </div>
                    </div>
                    <div id="batchDatesWrap" class="series-field batch-dates-wrap" style="display: none;">
                        <label>TARİHLER (HER SATIRA BİR TARİH, SERİ SIRASIYLA)</label>
                        <textarea id="batchDates" rows="4" placeholder="30.05.2026&#10;31.05.2026&#10;01.06.2026"></textarea>
                    </div>
                    <div id="batchStatus" class="batch-status"></div>
                    <div id="batchOutput" class="batch-output empty"></div>
                    <div class="batch-actions">
                        <button id="batchCopyBtn" class="btn-download-series" style="display: none;">
                            <i class="fas fa-copy"></i> Kopyala
                        </button>
                        <button id="batchDownloadBtn" class="btn-download-series" style="display: none;">
                            <i class="fas fa-download"></i> TXT Olarak İndir
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
